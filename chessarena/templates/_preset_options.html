{% for name, opt in options.items() %}
  <label>
    <span class="opt-name">{{ name }}</span>
    {% if opt.type == "check" %}
      <input type="checkbox" name="option_{{ name }}"
        {% if opt.default == "true" %}checked{% endif %}>
      <span class="muted">(check, default {{ opt.default }})</span>
    {% elif opt.type == "spin" %}
      <input type="number" name="option_{{ name }}" min="{{ opt.min }}" max="{{ opt.max }}" value="{{ opt.default }}">
      <span class="muted">(spin {{ opt.min }}..{{ opt.max }}, default {{ opt.default }})</span>
    {% elif opt.type == "combo" %}
      <select name="option_{{ name }}">
        {% for v in opt.vars %}
          <option value="{{ v }}" {% if v == opt.default %}selected{% endif %}>{{ v }}</option>
        {% endfor %}
      </select>
      <span class="muted">(combo, default {{ opt.default }})</span>
    {% elif opt.type == "string" %}
      <input type="text" value="{{ opt.default }}" disabled>
      <span class="muted">(string — managed via trusted registration)</span>
    {% endif %}
  </label>
{% endfor %}
{% if not options %}
  <p class="muted">No configurable UCI options for this build.</p>
{% endif %}
