name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHONUNBUFFERED: "1"

jobs:
  arena-tests:
    name: arena pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install arena dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install Playwright browser (PGN viewer / preset editor E2E)
        run: |
          python -m playwright install --with-deps chromium

      - name: Arena pytest suite
        run: python -m pytest tests/ -q

  frontend-build:
    name: replay-app build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install and build replay-app
        run: |
          cd frontend/replay-app
          npm ci
          npm run build

      - name: Committed build output is up to date
        run: |
          git diff --exit-code -- chessarena/static/replay-app/ || {
            echo "static/replay-app/ is out of date with the frontend source; run npm run build and commit";
            exit 1;
          }
