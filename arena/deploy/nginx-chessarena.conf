# ChessArena Nginx site fragment (section 18).
#
# Drop this into the existing pearllover.site server block (or include it).
# Auth split (P4.1): the ADMIN UI and the MANAGEMENT API stay behind Basic
# Auth; the public replay pages (/chessarena/ root, /matches/, /games/),
# the public read-only API (/public-api/v1) and static assets are public.
#
# Nginx uses the longest-prefix match, so /chessarena/admin/ and
# /chessarena/api/v1/ hit the auth locations while everything else falls
# through to the public location.  proxy_pass has NO trailing slash so the
# URI is passed through unchanged (the app relies on its base path).
#
# The app itself listens on 127.0.0.1:8787 and must never be exposed directly.

# --- include inside the 443 server for pearllover.site ---
location /chessarena/admin/ {
    auth_basic "ChessArena";
    auth_basic_user_file /etc/chessarena/.htpasswd;

    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

location /chessarena/api/v1/ {
    auth_basic "ChessArena";
    auth_basic_user_file /etc/chessarena/.htpasswd;

    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# Public: static assets (stylesheets + self-hosted JS), replay pages and the
# public read-only API.
location /chessarena/static/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

location /chessarena/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# Uvicorn emits no log here; the app writes structured logs to journald
# (captured by systemd) and artifacts to /var/lib/chessarena/runs.
