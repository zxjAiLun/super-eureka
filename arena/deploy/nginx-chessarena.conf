# ChessArena Nginx site fragment (section 18).
#
# Drop this into the existing pearllover.site server block (or include it).
# Security posture for v1: the WHOLE /chessarena/ tree is behind Basic Auth.
# The spec permits protecting read-only endpoints too for v1 ("第一版优先安全");
# if you later want the read API public, remove auth_basic from a separate
# read-only location.
#
# The app itself listens on 127.0.0.1:8787 and must never be exposed directly.

# --- include inside the 443 server for pearllover.site ---
location /chessarena/ {
    auth_basic "ChessArena";
    auth_basic_user_file /etc/chessarena/.htpasswd;

    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# Uvicorn emits no log here; the app writes structured logs to journald
# (captured by systemd) and artifacts to /var/lib/chessarena/runs.
