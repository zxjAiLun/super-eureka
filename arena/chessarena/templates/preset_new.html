{% extends "base.html" %}
{% block title %}ChessArena · New preset{% endblock %}
{% block content %}
<h1>Create engine preset</h1>

<form method="post" action="{{ settings.base_path }}/admin/presets" class="panel">
  <input type="hidden" name="_csrf_token" value="{{ request.state.csrf_token }}">
  <label>Engine build
    <select name="build_id" id="build-select" required>
      {% for b in builds %}
        <option value="{{ b.build_id }}">{{ b.engine_name }} ({{ b.build_id }})</option>
      {% endfor %}
    </select>
  </label>
  <label>Display name
    <input type="text" name="display_name" required maxlength="120" placeholder="Stockfish Full Strength">
  </label>
  <h3>UCI options</h3>
  <div id="preset-options"><p class="muted">Select an engine build…</p></div>
  <p class="muted">Arena-owned options (Hash, Threads, Ponder, OwnBook, UCI_Chess960) are managed by the runtime, not here.</p>
  <button type="submit">Create preset</button>
</form>

<script>
(function () {
  var sel = document.getElementById('build-select');
  var box = document.getElementById('preset-options');
  function loadOptions() {
    box.innerHTML = '<p class="muted">Loading…</p>';
    fetch('{{ settings.base_path }}/admin/presets/new/options?build_id=' +
          encodeURIComponent(sel.value), { headers: { 'X-Requested-With': 'fetch' } })
      .then(function (r) { return r.text(); })
      .then(function (html) { box.innerHTML = html; })
      .catch(function () {
        box.innerHTML = '<p class="danger">Failed to load options.</p>';
      });
  }
  sel.addEventListener('change', loadOptions);
  loadOptions();
})();
</script>
{% endblock %}
