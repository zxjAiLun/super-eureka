# Engine build deployment (section 20.2).
#
# Triggers: workflow_dispatch with inputs:
#   git_ref      - commit/tag to build (default: main)
#   build_label  - short label used in the immutable build directory name
#
# Flow:
#   1. checkout the pinned ref,
#   2. cargo test (debug + release), fmt, clippy,
#   3. cargo build --release --locked,
#   4. UCI identity probe,
#   5. compute binary SHA-256,
#   6. generate the build manifest,
#   7. upload to the server incoming dir,
#   8. server verifies SHA and atomically installs the immutable build dir,
#   9. register the build in the database.
#
# Existing tournaments keep running on their original build paths; nothing
# here mutates them (section 7).

name: deploy-engine-build

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "git ref to build"
        required: false
        default: "main"
      build_label:
        description: "short label for the build directory (e.g. linux-x86_64)"
        required: true
        default: "linux-x86_64"

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0

      - name: Install Rust 1.94.1 toolchain (rustfmt + clippy)
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test (debug)
        run: cargo test

      - name: cargo test (release)
        run: cargo test --release

      - name: cargo build --release --locked
        run: cargo build --release --locked

      - name: Compute build metadata
        id: meta
        run: |
          BIN="target/release/chess-engine-demo"
          SHA256=$(sha256sum "$BIN" | cut -d' ' -f1)
          GIT_SHA=$(git rev-parse HEAD)
          RUSTC_VERSION=$(rustc --version)
          CARGO_LOCK_SHA=$(sha256sum Cargo.lock | cut -d' ' -f1)
          BUILD_ID="$(date +%Y%m%d)-${GIT_SHA:0:7}-${{ inputs.build_label }}"
          echo "binary_sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "git_sha=$GIT_SHA" >> "$GITHUB_OUTPUT"
          echo "rustc_version=$RUSTC_VERSION" >> "$GITHUB_OUTPUT"
          echo "cargo_lock_sha256=$CARGO_LOCK_SHA" >> "$GITHUB_OUTPUT"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

      - name: UCI identity probe
        run: |
          printf 'uci\nquit\n' | ./target/release/chess-engine-demo | tee /tmp/uci-probe.txt
          grep -q "uciok" /tmp/uci-probe.txt
          grep -q "id name" /tmp/uci-probe.txt

      - name: Stage immutable build directory
        run: |
          mkdir -p /tmp/build-stage/engine
          cp target/release/chess-engine-demo /tmp/build-stage/engine/engine
          cat > /tmp/build-stage/engine/manifest.json <<EOF
          {
            "schema_version": 1,
            "build_id": "${{ steps.meta.outputs.build_id }}",
            "engine_name": "ChessEngineDemo",
            "git_sha": "${{ steps.meta.outputs.git_sha }}",
            "binary_sha256": "${{ steps.meta.outputs.binary_sha256 }}",
            "platform": "${{ inputs.build_label }}",
            "rustc_version": "${{ steps.meta.outputs.rustc_version }}",
            "cargo_lock_sha256": "${{ steps.meta.outputs.cargo_lock_sha256 }}",
            "supported_profiles": ["current-final", "current"],
            "uci_id_name": "ChessEngineDemo",
            "uci_id_author": "Rust-learner",
            "created_utc": "$(date -u +%Y-%m-%dT%H:%M:%S+00:00)"
          }
          EOF
          # Use the build_id for the tarball so the upload step and the SSH
          # install step reference the same file (P1.7).  The archive is
          # written into the repository workspace as a relative path: the
          # scp-action runs in a Docker container whose working directory is
          # /github/workspace, so a /tmp path on the runner host would be
          # invisible to it ("tar: empty archive").
          ARCHIVE="build-${{ steps.meta.outputs.build_id }}.tar.gz"
          tar -C /tmp/build-stage -czf "$ARCHIVE" .
          test -s "$ARCHIVE"
          tar -tzf "$ARCHIVE" >/dev/null

      - name: Upload build package
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ARENA_DEPLOY_HOST }}
          username: ${{ secrets.ARENA_DEPLOY_USER }}
          key: ${{ secrets.ARENA_DEPLOY_KEY }}
          source: build-${{ steps.meta.outputs.build_id }}.tar.gz
          target: /opt/chessarena/incoming/
          rm: false

      - name: Install and register on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ARENA_DEPLOY_HOST }}
          username: ${{ secrets.ARENA_DEPLOY_USER }}
          key: ${{ secrets.ARENA_DEPLOY_KEY }}
          command_timeout: "10m"
          script: |
            set -euo pipefail
            BUILD_ID="${{ steps.meta.outputs.build_id }}"
            # The wrapper validates the build id format and the uploaded
            # tarball SHA, installs the immutable build dir, and registers it.
            sudo /opt/chessarena/bin/arena-deploy build-install "$BUILD_ID"
            echo "build installed: /opt/chessarena/builds/$BUILD_ID"
