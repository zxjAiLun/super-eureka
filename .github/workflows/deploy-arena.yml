# Arena application deploy (section 20.2).
#
# Triggers: workflow_dispatch
#
# Flow:
#   1. run Python tests,
#   2. package arena/,
#   3. upload to the server temp dir,
#   4. create a new release dir,
#   5. create/update the virtualenv,
#   6. run Alembic migrations,
#   7. atomically switch /opt/chessarena/app/current,
#   8. restart the API and worker services,
#   9. hit /health,
#   10. roll back to the previous release if health fails.
#
# Secrets required:
#   ARENA_DEPLOY_HOST        e.g. pearllover.site
#   ARENA_DEPLOY_USER        e.g. deploy (a non-root user allowed the sudoers
#                            rules described in deploy/bootstrap.md)
#   ARENA_DEPLOY_KEY         private SSH key for that user (public key goes in
#                            the deploy user's authorized_keys)
#   ARENA_SERVER_HOST_KEY    known_hosts entry for the server

name: deploy-arena

on:
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: "1"

jobs:
  clean-install:
    name: clean venv install + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create a fresh virtualenv and install dependencies
        run: |
          python -m venv /tmp/arena-venv
          /tmp/arena-venv/bin/pip install --upgrade pip
          /tmp/arena-venv/bin/pip install -r arena/requirements-dev.txt
          /tmp/arena-venv/bin/pip install -e arena/

      - name: Smoke import from the clean venv
        run: |
          /tmp/arena-venv/bin/python -c "import chess; import chessarena; from chessarena.main import create_app; create_app()"

      - name: Run arena tests from the clean venv
        working-directory: arena
        run: /tmp/arena-venv/bin/python -m pytest tests/ -q

  test-and-deploy:
    needs: clean-install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install arena dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r arena/requirements-dev.txt

      - name: Run arena tests
        working-directory: arena
        run: python -m pytest tests/ -q

      - name: Package arena
        run: |
          tar --exclude='__pycache__' --exclude='*.pyc' --exclude='.pytest_cache' \
              -C arena -czf /tmp/arena.tar.gz .

      - name: Upload package
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ARENA_DEPLOY_HOST }}
          username: ${{ secrets.ARENA_DEPLOY_USER }}
          key: ${{ secrets.ARENA_DEPLOY_KEY }}
          source: /tmp/arena.tar.gz
          target: /opt/chessarena/incoming/
          rm: false

      - name: Deploy, migrate, switch, restart, health-check (with rollback)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ARENA_DEPLOY_HOST }}
          username: ${{ secrets.ARENA_DEPLOY_USER }}
          key: ${{ secrets.ARENA_DEPLOY_KEY }}
          command_timeout: "20m"
          script: |
            set -euo pipefail
            RELEASE="/opt/chessarena/releases/$(date +%Y%m%d%H%M%S)"
            PREV=$(readlink -f /opt/chessarena/app/current || true)

            if [ ! -f /opt/chessarena/incoming/arena.tar.gz ]; then
              echo "uploaded package not found: /opt/chessarena/incoming/arena.tar.gz"
              exit 1
            fi
            sudo -u chessarena mkdir -p "$RELEASE"
            sudo -u chessarena tar -xzf /opt/chessarena/incoming/arena.tar.gz -C "$RELEASE"
            sudo -u chessarena rm -f /opt/chessarena/incoming/arena.tar.gz

            # venv + deps
            if [ ! -d /opt/chessarena/venv ]; then
              sudo -u chessarena python3.12 -m venv /opt/chessarena/venv
            fi
            sudo -u chessarena /opt/chessarena/venv/bin/pip install -e "$RELEASE"

            # migrations (run as chessarena with the app env)
            set -a
            # shellcheck disable=SC1091
            . /etc/chessarena/chessarena.env
            set +a
            sudo -u chessarena /opt/chessarena/venv/bin/alembic \
              -c "$RELEASE/alembic.ini" upgrade head

            # atomic switch
            sudo -u chessarena ln -sfn "$RELEASE" /opt/chessarena/app/current

            # restart services (each via its own sudoers-allowed command)
            sudo systemctl restart chessarena-api
            sudo systemctl restart chessarena-worker

            # health check - Basic Auth lives at the Nginx layer, so the
            # internal check against 127.0.0.1:8787 needs no credentials.
            # Every field must be ok: overall status, database, the worker
            # heartbeat (the worker takes a few seconds to boot) and cutechess.
            HEALTH=""
            for i in $(seq 1 15); do
              sleep 2
              HEALTH=$(curl -fsS \
                "http://127.0.0.1:8787/chessarena/api/v1/health" || true)
              if echo "$HEALTH" | grep -q '"status": "ok"' \
                 && echo "$HEALTH" | grep -q '"database": "ok"' \
                 && echo "$HEALTH" | grep -q '"worker_heartbeat": "ok"' \
                 && echo "$HEALTH" | grep -q '"cutechess": "ok"'; then
                break
              fi
            done
            if ! echo "$HEALTH" | grep -q '"status": "ok"' \
               || ! echo "$HEALTH" | grep -q '"database": "ok"' \
               || ! echo "$HEALTH" | grep -q '"worker_heartbeat": "ok"' \
               || ! echo "$HEALTH" | grep -q '"cutechess": "ok"'; then
              echo "health gate failed: $HEALTH"
              if [ -n "$PREV" ] && [ -d "$PREV" ]; then
                echo "rolling back to $PREV"
                sudo -u chessarena ln -sfn "$PREV" /opt/chessarena/app/current
                sudo systemctl restart chessarena-api
                sudo systemctl restart chessarena-worker
                sleep 3
              fi
              exit 1
            fi
            echo "deploy OK: $HEALTH"
