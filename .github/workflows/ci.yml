name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.94.1 toolchain (with rustfmt + clippy)
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test (debug)
        run: cargo test

      - name: cargo test (release, includes Perft depth 5)
        run: cargo test --release

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python tournament dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: cargo build release engine
        run: cargo build --release

      - name: Python tournament unit tests
        run: python -m unittest discover -s tools -p "test_*.py"

      - name: E1 short protocol smoke
        run: |
          python tools/run_protocol_smoke.py \
            --engine-a target/release/eureka \
            --engine-b target/release/eureka \
            --profile-b current-final \
            --games 4 --movetime-ms 10 --move-grace-ms 25 \
            --max-plies 40 --hash-mb 16 --seed 0 \
            --output-dir tournament-results/ci-smoke
