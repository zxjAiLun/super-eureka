name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain (with rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test (debug)
        run: cargo test

      - name: cargo test (release, includes Perft depth 5)
        run: cargo test --release

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python tournament dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Python tournament unit tests
        run: python -m unittest discover -s tools -p "test_*.py"

      - name: E1 short self-play smoke
        run: |
          cargo build --release
          python tools/tournament.py \
            --engine-a target/release/chess-engine-demo \
            --engine-b target/release/chess-engine-demo \
            --games 4 --movetime-ms 10 --move-grace-ms 25 \
            --max-plies 40 --hash-mb 16 --seed 0 \
            --output-dir tournament-results/ci-smoke

  arena-tests:
    name: arena pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install arena dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r arena/requirements-dev.txt

      - name: Arena pytest suite
        working-directory: arena
        run: python -m pytest tests/ -q
